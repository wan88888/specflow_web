name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj

      - name: Restore
        run: dotnet restore SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj

      - name: Build
        run: dotnet build SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj --configuration Release --no-restore

      # Headless 仍会启动 Chromium，Linux 上需要少量系统库
      - name: Install headless Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Run tests
        run: >
          dotnet test SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj
          --configuration Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=test-results.trx"
          --results-directory "${{ github.workspace }}/TestResults"
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      # TRX 是 dotnet test 原生输出，再转成 HTML 方便阅读
      - name: Generate HTML test report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@v5.4.18
        with:
          reports: TestResults/*.trx
          targetdir: TestResults/html
          reporttypes: HtmlInline_AzurePipelines
          title: SpecFlow Web Tests

      - name: Add report link to job summary
        if: always()
        run: |
          {
            echo "## Test Report"
            echo ""
            echo "Download artifact **test-report-html**, then open \`index.html\` in your browser."
            echo ""
            echo "| Result |"
            echo "| --- |"
            if [ -f TestResults/html/index.html ]; then
              echo "| HTML report generated |"
            else
              echo "| HTML report not generated (tests may have failed before TRX output) |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-html
          path: TestResults/html/
          if-no-files-found: warn
          retention-days: 14
