name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj

      - name: Restore
        run: dotnet restore SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj

      - name: Build
        run: dotnet build SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj --configuration Release --no-restore

      - name: Install headless Chromium libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Run tests
        run: dotnet test SpecFlowWeb.Tests/SpecFlowWeb.Tests.csproj --configuration Release --no-build --verbosity normal
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-report-html
          path: TestResults/report.html
          if-no-files-found: warn
          retention-days: 14
